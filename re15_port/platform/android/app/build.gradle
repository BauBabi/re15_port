// =============================================================================
// RE1.5 Port — Android-App (SDLActivity + libmain.so) — 2026-09-19
// =============================================================================
// Bauweg (release/build_android.sh ruft genau das):
//   ./gradlew -Pre15Version=v0.8.4 fetchSdl2 assembleRelease
//
// Was dieses Skript ausser dem ueblichen AGP-Bau tut:
//   fetchSdl2          laedt SDL2-2.28.5.tar.gz (sha256-geprueft, dieselbe Version wie der
//                      PC-Bau per FetchContent) nach platform/android/_deps/ und entpackt es.
//                      Daraus kommen die Java-Klassen org.libsdl.app.* (SDLActivity) und
//                      der C-Quellbaum fuer libSDL2.so (jni/CMakeLists.txt).
//   stageAssets        kopiert (Sync) die fuenf Asset-Baeume in app/build/re15_assets/:
//                      shared_assets/PSX, shared_assets/extracted_fx, shared_assets/RE2,
//                      shared_assets/RE15DOOR, synchro/STAGE* — dieselbe Liste wie
//                      release/make_package.sh (copy_common), synchro/unused bleibt draussen.
//                      ⛔ Die Liste steht ein zweites Mal in release/apk_asset_gate.py (BAEUME);
//                      das Gate prueft beide gegeneinander und bricht ab, wenn sie abweichen.
//   writeAssetManifest schreibt dort re15_assets.txt, Format v2 (Runde 34a N1):
//                      "# re15 assets v2 <anzahl> <bytes>" + je Datei "<bytes>\t<sha256>\t<pfad>",
//                      nach Pfad sortiert. android_glue.c entpackt danach in den App-Speicherordner
//                      und vergleicht Groesse UND Summe mit dem zuletzt entpackten Stand (Regeln:
//                      jni/asset_abgleich.h; release/apk_asset_gate.py prueft die Liste in der APK).
//   noCompress         JEDE Endung der Asset-Baeume -> die APK speichert die Assets
//                      unkomprimiert (Entpacken = reines Kopieren, ~365 MB APK).
// =============================================================================
plugins {
    id 'com.android.application'
}

def repoRoot    = file("$projectDir/../../../..").canonicalFile
def portRoot    = new File(repoRoot, "re15_port")
def sdlVersion  = "2.28.5"
def sdlSha256   = "332cb37d0be20cb9541739c61f79bae5a477427d79ae85e352089afdaf6666e4"
def depsDir     = new File(projectDir.parentFile, "_deps")
def sdlSrc      = new File(depsDir, "SDL2-${sdlVersion}")
def assetStage  = layout.buildDirectory.dir("re15_assets").get().asFile
def re15Version = (project.findProperty("re15Version") ?: "v0.0.0-dev").toString()

// Hilfsfunktionen als CLOSURES, nicht als Script-Methoden: nur Closures sehen die
// script-lokalen def-Variablen (portRoot, repoRoot, ...) — eine Methode nicht
// ("Could not get unknown property 'portRoot'", gemessen 2026-09-19).
// v0.8.4 -> 80400 (Major*1000000 + Minor*10000 + Patch*100); Suffixe (-3-gabc) zaehlen nicht.
def computeVersionCode = { String v ->
    def m = (v =~ /(\d+)\.(\d+)\.(\d+)/)
    if (m.find()) {
        return m.group(1).toInteger() * 1000000 + m.group(2).toInteger() * 10000 + m.group(3).toInteger() * 100
    }
    return 1
}

def sha256 = { File f ->
    def md = java.security.MessageDigest.getInstance("SHA-256")
    f.withInputStream { is ->
        byte[] buf = new byte[1 << 20]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    return md.digest().collect { String.format("%02x", it) }.join()
}

// Alle Endungen (bzw. ganze Namen ohne Endung) der Asset-Baeume — fuer noCompress.
def noCompressList = { ->
    def exts = new TreeSet<String>()
    [new File(portRoot, "shared_assets"), new File(repoRoot, "synchro")].each { root ->
        if (!root.isDirectory()) return
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def n = f.name
            def i = n.lastIndexOf('.')
            def e = (i > 0 && i < n.length() - 1) ? n.substring(i + 1) : n
            exts << e
            exts << e.toLowerCase()
            exts << e.toUpperCase()
        }
    }
    return exts as List
}

tasks.register("fetchSdl2") {
    description = "SDL2 ${sdlVersion} laden (sha256-geprueft) und nach _deps/ entpacken"
    outputs.dir(sdlSrc)
    doLast {
        if (new File(sdlSrc, "CMakeLists.txt").exists()) {
            logger.lifecycle("SDL2 ${sdlVersion} liegt bereits unter ${sdlSrc}")
            return
        }
        depsDir.mkdirs()
        def tgz = new File(depsDir, "SDL2-${sdlVersion}.tar.gz")
        if (!tgz.exists() || sha256(tgz) != sdlSha256) {
            def url = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL2-${sdlVersion}.tar.gz"
            logger.lifecycle("Lade ${url}")
            tgz.withOutputStream { out -> new URL(url).openStream().withStream { inp -> out << inp } }
        }
        def got = sha256(tgz)
        if (got != sdlSha256) throw new GradleException("SDL2-Tarball: sha256 ${got} != erwartet ${sdlSha256}")
        copy {
            from tarTree(resources.gzip(tgz))
            into depsDir
        }
        if (!new File(sdlSrc, "CMakeLists.txt").exists())
            throw new GradleException("SDL2-Tarball entpackt, aber ${sdlSrc}/CMakeLists.txt fehlt")
    }
}

tasks.register("stageAssets", Sync) {
    description = "Asset-Baeume nach app/build/re15_assets/ spiegeln (dieselbe Liste wie make_package.sh)"
    into(assetStage)
    from(new File(portRoot, "shared_assets/PSX"))          { into "shared_assets/PSX" }
    from(new File(portRoot, "shared_assets/extracted_fx")) { into "shared_assets/extracted_fx" }
    from(new File(portRoot, "shared_assets/RE2"))          { into "shared_assets/RE2" }
    from(new File(portRoot, "shared_assets/RE15DOOR"))     { into "shared_assets/RE15DOOR" }   // Runde 33: Port-Tuerarchive
    from(new File(repoRoot, "synchro")) {
        into "synchro"
        include "STAGE*/**"        // synchro/unused/ + README bleiben draussen (kein Codepfad liest sie)
    }
    preserve { include "re15_assets.txt" }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doFirst {
        ["shared_assets/PSX/STAGE1", "shared_assets/extracted_fx/effect0_blood.tim",
         "shared_assets/RE2/CDEMD0.EMS", "shared_assets/RE2/ENEMSE.VBS"].each { rel ->
            if (!new File(portRoot, rel).exists())
                throw new GradleException("Asset fehlt im Repo: re15_port/${rel}")
        }
        // Tuerarchive (Runde 34a): nicht an EINER Datei festmachen (bis v0.8.19 nur RE15DOOR/P07G.DO2)
        // - beide Ordner muessen *.DO2 enthalten. Ob JEDE Datei bytegleich in der APK liegt, prueft
        // release/apk_asset_gate.py (release/build_android.sh, Abschnitt Gates).
        ["shared_assets/RE2/DOOR", "shared_assets/RE15DOOR"].each { rel ->
            def n = (new File(portRoot, rel).listFiles() ?: []).count { it.isFile() && it.name.endsWith(".DO2") }
            if (n == 0)
                throw new GradleException("Tuerarchive fehlen im Repo: re15_port/${rel}/*.DO2 (0 Dateien)")
            logger.lifecycle("stageAssets: re15_port/${rel}: ${n} x *.DO2")
        }
        if (!new File(repoRoot, "synchro/STAGE1/room1170/main00.wav").exists())
            throw new GradleException("Voiceover fehlt im Repo: synchro/STAGE1/room1170/main00.wav")
    }
}

tasks.register("writeAssetManifest") {
    description = "re15_assets.txt Format v2 (Groesse + sha256 + Pfad je Datei) fuer das Entpacken auf dem Geraet"
    dependsOn "stageAssets"
    def manifest = new File(assetStage, "re15_assets.txt")
    inputs.files(fileTree(assetStage) { exclude "re15_assets.txt" })
    outputs.file(manifest)
    doLast {
        // Runde 34a N1: bis v0.8.19 nur "<bytes>\t<pfad>" -> eine gleich grosse Aenderung blieb auf dem
        // Geraet alt (Befund N1a). Jetzt mit sha256 je Datei; das Geraet vergleicht Groesse UND Summe.
        def rows = []
        long total = 0
        fileTree(assetStage) { exclude "re15_assets.txt" }.visit { d ->
            if (!d.isDirectory()) {
                def rel = d.relativePath.pathString
                // Regeln der Liste v2 (vollstaendig: jni/asset_abgleich.h, geprueft von
                // release/apk_asset_gate.py) - hier, damit der Bau frueh und deutlich abbricht.
                // Nachbesserung R4-1 (Gegenpruefung H5/U3): NUR druckbares ASCII 0x20-0x7e (der App-Speicher faltet
                // Unicode-Gross/klein und -Normalform - Kelvin-Zeichen/K waeren auf dem Geraet EINE Datei) und jedes
                // Segment <= 251 Bytes (Geraet: Name <= 255 B, der Entpacker haengt ".neu" an).
                // Runde 35 Spur N, Regel R1: KEIN Segment endet auf ".neu" (vorher nur der ganze Pfad) - ein Ordner
                // <ziel>.neu stuende auf dem Geraet der Zwischendatei im Weg (Befund F-Y4).
                if (!rel.contains("/") || rel.contains("\\") || rel.length() > 512
                        || rel.chars().anyMatch { int c -> c < 0x20 || c > 0x7e }
                        || rel.split("/", -1).any { String s -> s.isEmpty() || s == "." || s == ".." || s.length() > 251
                                                              || s.toLowerCase(Locale.ROOT).endsWith(".neu") })
                    throw new GradleException("Asset-Pfad verletzt die Regeln der Liste v2 (nur druckbares ASCII, " +
                                              "Segment 1-251 B, siehe jni/asset_abgleich.h): '${rel}'")
                def len = d.file.length()
                rows << [rel, len, sha256(d.file)]
                total += len
            }
        }
        // Pfade, die sich nur in ASCII-Gross/klein unterscheiden: auf dem Geraet EINE Datei (Dublettenregel der Liste v2)
        def falten = rows.groupBy { it[0].toLowerCase(Locale.ROOT) }.findAll { k, v -> v.size() > 1 }
        if (!falten.isEmpty())
            throw new GradleException("Asset-Pfade nur in Gross/klein verschieden (auf dem Geraet EINE Datei): " +
                                      falten.values().collect { v -> v.collect { it[0] }.join(" / ") }.join(", "))
        // Runde 35 Spur N, Regel R2: kein Pfad ist zugleich Ordner eines anderen (Gross/klein egal) - wie der
        // Geraete-Leser (jni/asset_abgleich.c) und das Gate (release/apk_asset_gate.py manifest_lesen)
        def klein = rows.collect { it[0].toLowerCase(Locale.ROOT) } as Set
        def doppelt = rows.findAll { r ->
            def t = r[0].toLowerCase(Locale.ROOT).split("/")
            (1..<t.length).any { i -> klein.contains(t[0..<i].join("/")) }
        }
        if (!doppelt.isEmpty())
            throw new GradleException("Asset-Pfad zugleich Datei und Ordner (auf dem Geraet nicht beides moeglich): " +
                                      doppelt.collect { it[0] }.join(", "))
        rows.sort { a, b -> a[0] <=> b[0] }      // nach Pfad (reines ASCII: UTF-16-Reihenfolge = Bytefolge)
        def text = "# re15 assets v2 ${rows.size()} ${total}\n" +
                   rows.collect { "${it[1]}\t${it[2]}\t${it[0]}" }.join("\n") + "\n"
        manifest.setText(text, "UTF-8")
        logger.lifecycle("re15_assets.txt (v2): ${rows.size()} Dateien, ${total} Bytes, sha256 je Datei")
        if (rows.size() < 3000) throw new GradleException("Asset-Liste zu kurz (${rows.size()} < 3000) — Staging unvollstaendig?")
    }
}

android {
    namespace "de.re15.port"
    compileSdk 35
    buildToolsVersion "35.0.0"       // = BUILD_TOOLS_PKG in release/build_android.sh (sonst zieht AGP 34.0.0 nach)
    ndkVersion "27.2.12479018"       // = NDK_PKG in release/build_android.sh

    defaultConfig {
        applicationId "de.re15.port"
        minSdk 24
        targetSdk 35
        versionCode computeVersionCode(re15Version)
        versionName re15Version
        ndk {
            abiFilters "arm64-v8a", "x86_64"    // x86_64 = Emulator
        }
        externalNativeBuild {
            cmake {
                arguments "-DRE15_BUILD_PC=OFF",
                          "-DRE15_BUILD_ANDROID=ON",
                          "-DRE15_BUILD_TESTS=OFF",
                          "-DRE15_BUILD_TOOLS=OFF",
                          "-DRE15_SDL2_SRC=" + sdlSrc.absolutePath.replace('\\', '/'),
                          "-DRE15_ASSETS_PATH=" + new File(portRoot, "shared_assets/PSX").absolutePath.replace('\\', '/'),
                          "-DANDROID_STL=c++_static",
                          "-DANDROID_PLATFORM=android-24"
                targets "main", "SDL2"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path new File(portRoot, "CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(sdlSrc, "android-project/app/src/main/java")
            assets.srcDirs += assetStage
        }
    }

    androidResources {
        noCompress += noCompressList()
    }

    signingConfigs {
        // Standard: der Android-Debug-Schluessel (~/.android/debug.keystore) — fuer Sideload
        // ausreichend. Ein eigener Schluessel per RE15_KEYSTORE/RE15_KEYSTORE_PASS/
        // RE15_KEY_ALIAS/RE15_KEY_PASS (Umgebung) ueberschreibt das.
        // ⛔ Gesetzt, aber die Datei fehlt -> ABBRUCH (Runde 34a, Nachbesserung R2, Gegenpruefung B4):
        // bis dahin wurde dann still mit dem Debug-Schluessel signiert. Welcher Signer herauskommen
        // muss, haelt release/apk_signer.sha256 fest (release/apk_pruefen.sh vergleicht).
        release {
            def ks = System.getenv("RE15_KEYSTORE")
            if (ks && !new File(ks).exists())
                throw new GradleException("RE15_KEYSTORE=${ks} existiert nicht - kein stiller Rueckfall auf den Debug-Schluessel")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("RE15_KEYSTORE_PASS") ?: ""
                keyAlias System.getenv("RE15_KEY_ALIAS") ?: "re15"
                keyPassword System.getenv("RE15_KEY_PASS") ?: (System.getenv("RE15_KEYSTORE_PASS") ?: "")
            } else {
                initWith debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

preBuild.dependsOn("fetchSdl2", "writeAssetManifest")
