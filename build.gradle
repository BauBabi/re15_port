plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'de.re15'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.imgscalr:imgscalr-lib:4.2' // BufferedImage dependency
    // MP3 decoding via javax.sound.sampled (ServiceProvider) — mirrors python _ensure_wav_input
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'com.googlecode.soundlibs:mp3spi:1.9.5.4'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
}

application {
    mainClass = 'de.re15.Main'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Konfiguriere Jar-Task fuer ausfuehrbare JAR-Datei
jar {
    manifest {
        attributes(
            'Main-Class': 'de.re15.Main',
            'Implementation-Title': 'RE1.5 File Extractor',
            'Implementation-Version': version
        )
    }
}

// Fat JAR mit allen Abhaengigkeiten
shadowJar {
    archiveBaseName.set('re15-extractor')
    archiveClassifier.set('fat')
    archiveVersion.set(version)

    manifest {
        attributes(
            'Main-Class': 'de.re15.Main',
            'Implementation-Title': 'RE1.5 File Extractor (Fat JAR)',
            'Implementation-Version': version
        )
    }

    // Merge service files (wichtig fuer einige Libraries)
    mergeServiceFiles()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

